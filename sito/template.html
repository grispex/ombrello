<title>Ombrello Italiano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Una sola pagina: fascia bianca con il titolo, sotto la mappa a tutto schermo su nero.
   Due pannelli bianchi escono dai lati con maniglie a gradini. Aspetto unico, non cambia con il tema. */
:root {
  --black: #000000;
  --white: #ffffff;
  --grey: #777777;
  --rule: #e2e2e2;
  --sans: "Inter", Helvetica, Arial, sans-serif;
  --head: 64px;
  --step: 28px;
  color-scheme: light;
}
* { box-sizing: border-box; border-radius: 0 !important; }
input, select, button { -webkit-appearance: none; appearance: none; }
input[type=search]::-webkit-search-decoration { -webkit-appearance: none; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--black); color: var(--black); font: 15px/1.45 var(--sans); overflow: hidden; }
button, input { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; }
:focus-visible { outline: 2px solid var(--grey); outline-offset: 2px; }
a { color: inherit; }

header { position: fixed; top: 0; left: 0; right: 0; height: calc(var(--head) + env(safe-area-inset-top, 0px)); background: var(--white); z-index: 10;
  padding: env(safe-area-inset-top, 0px) max(36px, env(safe-area-inset-right, 0px)) 0 max(36px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 8px; }
header h1 { margin: 0; font-size: 22px; line-height: 1.12; font-weight: 700; letter-spacing: .01em; }
header p { margin: 0; color: var(--grey); font-size: 15px; text-align: right; }
@media (max-width: 640px) { header p { display: none; } }

.stage { position: fixed; top: calc(var(--head) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0; background: var(--black); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.mmsg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--white); padding: 24px; text-align: center; }

/* maniglie a gradini */
.steps { display: flex; flex-direction: column; }
.steps span { display: flex; align-items: center; height: var(--step); background: var(--white); color: var(--grey); font-weight: 700; font-size: 19px; text-transform: uppercase; white-space: nowrap; }
.label-btn { cursor: pointer; }

/* pannello destro: questioni */
.rp { position: absolute; right: 0; top: 21%; bottom: 16%; width: min(470px, calc(100vw - 110px)); background: var(--white); transform: translateX(100%); transition: transform .35s ease; z-index: 5; }
.rp.open { transform: none; }
.rp .handle { position: absolute; top: 0; right: 100%; cursor: pointer; align-items: flex-end; }
.rp .handle span:nth-child(1) { width: 96px; }
.rp .handle span:nth-child(2) { width: 75px; }
.rp .handle span:nth-child(3) { width: 54px; }
.rp .body { height: 100%; overflow-y: auto; padding: calc(var(--step) * 2) 18px 22px 16px; display: flex; flex-direction: column; gap: 12px; }
.rp h2, .lp h2 { margin: 0; color: var(--grey); font-size: 19px; font-weight: 700; text-transform: uppercase; line-height: var(--step); }

/* pannello sinistro: navigazione */
.nav { position: absolute; left: 0; bottom: 14%; z-index: 7; }
.nav span { justify-content: flex-end; padding-right: 7px; transition: width .35s ease; }
.nav span:nth-child(1) { width: 63px; }
.nav span:nth-child(2) { width: 81px; }
.nav span:nth-child(3) { width: 105px; }
.nav.open span:nth-child(1) { width: 216px; }
.nav.open span:nth-child(2) { width: 234px; }
.nav.open span:nth-child(3) { width: 258px; }
.nav span em { font-style: normal; opacity: 0; transition: opacity .2s ease; }
.nav.open span em { opacity: 1; }
.nav span.on { color: var(--black); }

/* libreria */
.lp { position: absolute; inset: 0; background: var(--white); z-index: 6; overflow-y: auto; padding: 18px max(22px, env(safe-area-inset-right, 0px)) 200px max(22px, env(safe-area-inset-left, 0px)); }
.lp .in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
/* in libreria: niente pannello destro, menu a colori invertiti */
body.lib .rp { display: none; }
body.lib .nav span { background: var(--black); color: var(--grey); }
body.lib .nav span.on { color: var(--white); }

/* contenuti dei pannelli */
.muted { color: var(--grey); }
.mono { font-variant-numeric: tabular-nums; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--black); padding: 2px 8px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--black); color: var(--white); }
.lab { font-size: 12px; color: var(--grey); text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
.search { border: 1px solid var(--black); padding: 5px 8px; width: 100%; }
.qlist { display: flex; flex-direction: column; }
.qlist button { text-align: left; border-bottom: 1px solid var(--rule); padding: 8px 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.qlist button:hover span:first-child { text-decoration: underline; }
.back { align-self: flex-start; cursor: pointer; color: var(--grey); font-weight: 700; text-transform: uppercase; font-size: 13px; }
.g { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--black); border-radius: 50% !important; vertical-align: -1px; }
.g.S { background: var(--black); }
.g.R { background: linear-gradient(90deg, var(--black) 50%, transparent 50%); }
.g.A { border-style: dotted; }
.g.N { position: relative; }
.g.N::after { content: ""; position: absolute; left: 1px; right: 1px; top: 3.5px; border-top: 1px solid var(--black); }
.pos { display: grid; grid-template-columns: minmax(50px, 96px) minmax(0, 1fr); gap: 4px 10px; font-size: 14px; }
.pos > b { font-weight: 700; }
.prova { border-left: 1px solid var(--black); padding-left: 9px; margin-top: 4px; }
.prova q { font-style: italic; quotes: "«" "»"; }
.item { padding: 8px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 3px; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--grey); }
.item .meta b { color: var(--black); }
.area-h { margin: 14px 0 0; font-size: 15px; border-bottom: 1px solid var(--black); padding-bottom: 3px; }
.sub-h { margin-top: 8px; font-style: italic; color: var(--grey); font-size: 13px; }
details summary { cursor: pointer; font-size: 12px; color: var(--grey); }
blockquote { margin: 4px 0; padding-left: 9px; border-left: 1px solid var(--black); font-style: italic; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters select, .filters input { border: 1px solid var(--black); padding: 5px 8px; background-color: var(--white); color: var(--black); font: inherit; font-size: 14px; }
/* menu a tendina disegnati a mano: testo sempre visibile, angoli netti, freccia a due tratti */
.filters select { -webkit-appearance: none; appearance: none; padding-right: 26px; min-width: 150px;
  background-image: linear-gradient(45deg, transparent 50%, var(--black) 50%), linear-gradient(135deg, var(--black) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.filters input { flex: 1 1 220px; min-width: 0; }
.more { align-self: flex-start; border: 1px solid var(--black); padding: 5px 12px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .rp, .nav span, .nav span em { transition: none; } }
</style>

<header>
  <h1>OMBRELLO<br>ITALIANO</h1>
  <p>Le proposte dei partiti in Parlamento e dove convergono. Dati al <span id="data"></span>.</p>
</header>

<main class="stage" id="stage">
  <canvas id="mcanvas" aria-label="Mappa 3D delle convergenze. Al centro i partiti; sopra le idee condivise, sotto quelle che dividono. Trascina per ruotare, scorri per ingrandire, tocca una sfera per aprire la questione."></canvas>
  <div class="mmsg" id="mmsg" hidden></div>

  <section class="lp" id="lib" hidden aria-label="Libreria"><div class="in">
    <h2>Libreria</h2>
    <div class="filters">
      <input type="search" id="q" placeholder="Cerca tra le proposte" aria-label="Cerca tra le proposte">
      <select id="area" aria-label="Area"></select>
      <select id="part" aria-label="Partito"></select>
      <select id="conc" aria-label="Concretezza">
        <option value="1">Ogni concretezza</option>
        <option value="2">Obiettivi e misure</option>
        <option value="3">Misure precise</option>
        <option value="4">Misure con cifre</option>
      </select>
    </div>
    <div id="res" aria-live="polite"></div>
  </div></section>

  <nav class="nav steps" id="nav" aria-label="Sezioni">
    <span class="label-btn" id="navtoggle" role="button" tabindex="0" aria-expanded="false" aria-label="Apri il menu"></span>
    <span class="label-btn on" id="go-map" role="button" tabindex="0"><em>Mappa</em></span>
    <span class="label-btn" id="go-lib" role="button" tabindex="0"><em>Libreria</em></span>
  </nav>

  <aside class="rp" id="rp" aria-label="Questioni">
    <div class="handle steps" id="rptoggle" role="button" tabindex="0" aria-expanded="false" aria-label="Apri le questioni"><span></span><span></span><span></span></div>
    <div class="body" id="rpbody"></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D = /*DATI*/null;
const $ = (id) => document.getElementById(id);
const P = Object.fromEntries(D.partiti.map(p => [p.id, p]));
const AREA = Object.fromEntries(D.aree.map(a => [a.id, a.nome]));
const PROP = Object.fromEntries(D.proposte.map(r => [r[0], r]));
const POSN = { S: "favorevole", R: "con riserve", N: "contrario", A: "ambiguo" };
const TIPO = { A: "Programma elettorale", B: "Documento del partito", C: "Atto parlamentare", D: "Voto", E: "Atto di governo", F: "Dichiarazione" };
const COLS = D.partiti.filter(p => D.questioni.some(q => q.p.some(x => x[0] === p.id))).map(p => p.id);
const fav = (s) => s === "S" || s === "R";

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const sig = (id) => P[id] ? P[id].sigla : id;
const press = (node, fn) => { node.addEventListener("click", fn); node.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }); };
$("data").textContent = D.data;

/* dettaglio di una questione */
function fonteDi(r) {
  const f = D.fonti[r[4]] || {};
  return el("div", { class: "mono muted" }, (TIPO[f.k] || "Fonte") + " · ", f.u ? el("a", { href: f.u, target: "_blank", rel: "noopener noreferrer", text: f.t || r[4] }) : (f.t || r[4]), f.d ? " · " + f.d : "", r[10] ? " · " + r[10] : "");
}
function dettaglio(q) {
  const box = el("div", { style: "display:flex;flex-direction:column;gap:10px" });
  if (q.s) box.append(el("p", { class: "muted", style: "margin:0", text: q.s }));
  const f = q.f || {};
  box.append(el("p", { class: "mono", style: "margin:0" }, `Favorevoli: ${f.favorevoli || 0} partiti · ${f.seggi_camera || 0} seggi Camera, ${f.seggi_senato || 0} Senato` +
    (f.trasversale ? " · trasversale" : "") + (q.g ? " · convergenza " + q.g : "") + (f.maggioranza_camera ? " · maggioranza alla Camera" : "")));
  if (q.gn) box.append(el("p", { class: "muted", style: "margin:0", text: q.gn }));
  const ord = { S: 0, R: 1, A: 2, N: 3 }, gruppi = [];
  [...q.p].sort((a, b) => ord[a[1]] - ord[b[1]]).forEach(x => {
    const k = [x[1], x[2], x[4], x[3].join(",")].join("|"), g = gruppi.find(y => y.k === k);
    if (g) g.pt.push(x[0]); else gruppi.push({ k, pt: [x[0]], x });
  });
  gruppi.forEach(({ pt, x: [, pos, par, prove, nota] }) => {
    const right = el("div", {}, el("div", {}, el("i", { class: "g " + pos }), " " + POSN[pos] + (par ? " · " + par : "") + (nota ? " · " + nota : "")));
    prove.forEach(id => { const r = PROP[id]; if (r) right.append(el("div", { class: "prova" }, el("div", { text: r[2] }), el("q", { text: r[3] }), fonteDi(r))); });
    box.append(el("div", { class: "pos" }, el("b", { text: pt.map(sig).join(", ") }), right));
  });
  return box;
}

/* navigazione a sinistra */
const nav = $("nav");
function setNav(open) { nav.classList.toggle("open", open); $("navtoggle").setAttribute("aria-expanded", String(open)); }
press($("navtoggle"), () => setNav(!nav.classList.contains("open")));
function view(v) {
  $("lib").hidden = v !== "lib";
  $("go-map").classList.toggle("on", v === "map"); $("go-lib").classList.toggle("on", v === "lib");
  document.body.classList.toggle("lib", v === "lib");
  if (v === "lib") { renderL(); $("lib").scrollTop = 0; }
  setNav(false);
}
press($("go-map"), () => { if (!nav.classList.contains("open")) return setNav(true); view("map"); });
press($("go-lib"), () => { if (!nav.classList.contains("open")) return setNav(true); view("lib"); });

/* libreria */
const st = { shown: 100 };
$("area").append(el("option", { value: "", text: "Tutte le aree" }));
D.aree.forEach(a => $("area").append(el("option", { value: a.id, text: a.nome })));
$("part").append(el("option", { value: "", text: "Tutti i partiti" }));
D.partiti.filter(p => p.n).forEach(p => $("part").append(el("option", { value: p.id, text: p.nome + " (" + p.n + ")" })));
function renderL() {
  const q = $("q").value.trim().toLowerCase(), a = $("area").value, pt = $("part").value, c = +$("conc").value;
  const list = D.proposte.filter(r => (!a || r[5].includes(a)) && (!pt || r[1].includes(pt)) && r[7] >= c &&
    (!q || r[2].toLowerCase().includes(q) || r[3].toLowerCase().includes(q) || r[6].toLowerCase().includes(q)));
  const res = $("res"); res.replaceChildren(el("p", { class: "mono muted", style: "margin:0", text: list.length.toLocaleString("it-IT") + " proposte" }));
  let la = null, ls = null;
  list.slice(0, st.shown).forEach(r => {
    const ar = a || r[5][0];
    if (ar !== la) { res.append(el("h3", { class: "area-h", text: AREA[ar] })); la = ar; ls = null; }
    if (r[6] !== ls) { res.append(el("div", { class: "sub-h", text: r[6] })); ls = r[6]; }
    res.append(el("div", { class: "item" }, el("div", { text: r[2] }),
      el("div", { class: "meta" }, el("b", { text: r[1].map(sig).join(", ") }), el("span", { text: "concretezza " + r[7] + "/4" }), el("span", { text: r[9] }), el("span", { text: r[0] })),
      el("details", {}, el("summary", { text: "citazione e fonte" }), el("blockquote", { text: r[3] }), fonteDi(r))));
  });
  if (list.length > st.shown) res.append(el("button", { class: "more", type: "button", text: "Mostra altre", onclick: () => { st.shown += 100; renderL(); } }));
}
["area", "part", "conc"].forEach(id => $(id).addEventListener("change", () => { st.shown = 100; renderL(); }));
$("q").addEventListener("input", () => { st.shown = 100; renderL(); });

/* stato condiviso tra mappa e pannello delle questioni */
const S = { area: "", party: "", contrari: false, sel: null, cerca: "" };
let paint = () => {};
const rp = $("rp");
function setRP(open) { rp.classList.toggle("open", open); $("rptoggle").setAttribute("aria-expanded", String(open)); }
press($("rptoggle"), () => setRP(!rp.classList.contains("open")));

function panel() {
  const b = $("rpbody"); b.replaceChildren();
  if (S.sel) {
    const q = S.sel.q;
    b.append(el("button", { class: "back", type: "button", text: "← Questioni", onclick: () => { S.sel = null; paint(); panel(); } }),
      el("h3", { style: "margin:0;font-size:17px", text: q.d }), el("p", { class: "mono muted", style: "margin:0", text: AREA[q.a] + (S.sel.divisa ? " · divide i partiti" : " · condivisa") }), dettaglio(q));
    b.scrollTop = 0; return;
  }
  b.append(el("h2", { text: "Questioni" }));
  /* comandi provvisori */
  const aree = [...new Set(D.questioni.map(q => q.a))];
  const chip = (txt, on, fn) => el("button", { type: "button", class: "chip", "aria-pressed": String(on), text: txt, onclick: fn });
  b.append(el("div", { class: "lab", text: "Area" }), el("div", { class: "chips" },
    chip("Tutte", !S.area, () => { S.area = ""; paint(); panel(); }), ...aree.map(a => chip(AREA[a], S.area === a, () => { S.area = a; paint(); panel(); }))));
  b.append(el("div", { class: "lab", text: "Evidenzia un partito" }), el("div", { class: "chips" },
    ...COLS.map(p => chip(sig(p), S.party === p, () => { S.party = S.party === p ? "" : p; paint(); panel(); }))));
  b.append(el("div", { class: "chips" }, chip("Mostra i contrari", S.contrari, () => { S.contrari = !S.contrari; paint(); panel(); })));
  const inp = el("input", { class: "search", type: "search", placeholder: "Cerca una questione", "aria-label": "Cerca una questione", value: S.cerca });
  const ul = el("div", { class: "qlist" });
  const lista = () => {
    ul.replaceChildren();
    const vis = (window.__nodes || []).filter(nd => (!S.area || nd.q.a === S.area) && (!S.party || nd.q.p.some(x => x[0] === S.party)) && (!S.cerca || nd.q.d.toLowerCase().includes(S.cerca)))
      .sort((x, y) => (y.q.f.seggi_camera || 0) - (x.q.f.seggi_camera || 0));
    vis.forEach(nd => ul.append(el("button", { type: "button", onclick: () => { S.sel = nd; paint(); panel(); } }, el("span", { text: nd.q.d }),
      el("span", { class: "mono muted", text: AREA[nd.q.a] + " · " + (nd.divisa ? "divide" : "condivisa") + " · " + (nd.q.f.seggi_camera || 0) + " seggi" }))));
    if (!vis.length) ul.append(el("p", { class: "muted", text: "Nessuna questione con questi filtri." }));
  };
  inp.addEventListener("input", e => { S.cerca = e.target.value.toLowerCase(); lista(); });
  b.append(inp, ul);
  lista();
}

/* mappa: partiti al centro, idee condivise sopra, idee che dividono sotto */
(function map() {
  const canvas = $("mcanvas"), msg = $("mmsg");
  let ok = typeof THREE !== "undefined" && THREE.OrbitControls, renderer;
  if (ok) { try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); renderer.setClearColor(0x000000, 1); } catch (e) { ok = false; } }
  if (!ok) { msg.hidden = false; msg.textContent = "Il browser non riesce a mostrare la mappa 3D. Apri le questioni dal pannello a destra."; window.__nodes = D.questioni.map(q => ({ q, divisa: q.p.some(x => x[1] === "N") && q.p.some(x => fav(x[1])) })); panel(); return; }

  /* ordine dei partiti calcolato dai dati */
  const n = COLS.length, Dm = [];
  for (let i = 0; i < n; i++) {
    Dm.push([]);
    for (let j = 0; j < n; j++) {
      let c = 0, a = 0;
      D.questioni.forEach(q => {
        const x = q.p.find(v => v[0] === COLS[i]), y = q.p.find(v => v[0] === COLS[j]);
        if (x && y && x[1] !== "A" && y[1] !== "A") { c++; if (fav(x[1]) === fav(y[1])) a++; }
      });
      Dm[i].push(i === j ? 0 : c >= 2 ? 1 - a / c : 0.6);
    }
  }
  const B = Dm.map(r => r.map(d => -0.5 * d * d));
  const rm = B.map(r => r.reduce((s, v) => s + v, 0) / n), gm = rm.reduce((s, v) => s + v, 0) / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) B[i][j] = B[i][j] - rm[i] - rm[j] + gm;
  function eig(M, skip) {
    let v = M.map((_, i) => Math.sin(i + 1) + 0.5);
    for (let it = 0; it < 200; it++) {
      let w = M.map(r => r.reduce((s, x, k) => s + x * v[k], 0));
      if (skip) { const d = w.reduce((s, x, k) => s + x * skip[k], 0); w = w.map((x, k) => x - d * skip[k]); }
      const nn = Math.hypot(...w) || 1; v = w.map(x => x / nn);
    }
    return v;
  }
  const e1 = eig(B), e2 = eig(B, e1);
  const ord = COLS.map((p, i) => [p, Math.atan2(e2[i], e1[i])]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  const R0 = 1.3, R = 6.5, dir = {};
  ord.forEach((p, i) => { const t = i / ord.length * Math.PI * 2; dir[p] = new THREE.Vector2(Math.cos(t), Math.sin(t)); });

  const nodes = D.questioni.map((q, j) => {
    const fv = q.p.filter(x => fav(x[1]) && dir[x[0]]), cv = q.p.filter(x => x[1] === "N" && dir[x[0]]);
    const F = q.f.seggi_camera || 0, v = new THREE.Vector2();
    fv.forEach(x => v.addScaledVector(dir[x[0]], x[1] === "S" ? 1 : 0.6));
    cv.forEach(x => v.addScaledVector(dir[x[0]], -0.6));

  axis.computeLineDistances(); scene.add(axis);

  const pmesh = {}, pdot = new THREE.SphereGeometry(0.09, 16, 12);
  ord.forEach(p => {

  const sph = new THREE.SphereGeometry(1, 24, 16), hits = [];

  });

  paint = function () {
    ord.forEach(p => pmesh[p].scale.setScalar(S.party === p ? 1.7 : 1));
    nodes.forEach(nd => {
      const inA = !S.area || nd.q.a === S.area, inP = !S.party || nd.q.p.some(x => x[0] === S.party), on = inA && inP && (!S.sel || S.sel === nd);

  };
